<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Karaoke AI V5.4</title>
<style>
:root{color-scheme:dark;--bg:#170e2a;--panel:#281741;--pink:#f0b1ff;--muted:#baa8d5;--violet:#a05cf0}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 50% 0,#33204d 0%,var(--bg) 58%);color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:12px 12px calc(18px + env(safe-area-inset-bottom))}header{text-align:center;flex:none}h1{font-size:clamp(21px,5vw,29px);margin:0;color:var(--pink);letter-spacing:.6px}.tag{font-size:11px;color:#c9b2e8;margin:3px 0}.mic{font-size:27px;margin:5px 0}.song{font-weight:750;font-size:17px;margin:0}.artist{color:#c9b2e8;font-size:12px;margin:2px 0 9px}.switches{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-bottom:10px}.switches button{border:1px solid #76589a;border-radius:30px;background:#27183e;color:white;padding:9px 12px;font-size:12px;cursor:pointer}.switches button.active{background:#9450d5;border-color:#9450d5;font-weight:700}#lyrics{flex:1;min-height:100px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#76518d transparent;overscroll-behavior:contain;padding:6px 8px 14px;text-align:center;mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 92%,transparent 100%)}.line{font-size:clamp(21px,5.8vw,31px);line-height:1.34;color:#9076b4;padding:12px 2px;margin:7px 0 17px;transition:color .2s,transform .2s}.line.current{color:#fff;font-weight:700;text-shadow:0 0 18px #ae66f08c}.word{transition:color .08s}.line.current .word.sung{color:#edb1ff}.translation{font-size:clamp(14px,3.7vw,17px);color:#d4b4f0;line-height:1.35;margin-top:8px;font-weight:400;text-shadow:none}.translation:empty{display:none}.translation.hidden{display:none}.player-panel{flex:none;background:linear-gradient(180deg,#302047,#221534);border:1px solid #6d4c87;border-radius:22px;padding:12px 14px 10px;box-shadow:0 -8px 30px #10091e88}.timeline{display:flex;align-items:center;gap:9px;color:#ddd0ee;font-size:12px;font-variant-numeric:tabular-nums}.timeline input{flex:1;min-width:0;accent-color:#ce8cff;height:22px;cursor:pointer}.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;gap:5px;margin-top:6px}.control{background:#493061;border:1px solid #775397;color:#fff;border-radius:15px;min-height:57px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-size:10px;cursor:pointer;touch-action:manipulation}.control .symbol{font-size:24px;line-height:1.1}.control.primary{background:#a460e2;border-color:#bd82f3;min-height:62px}.control:active{transform:scale(.97)}.foot{display:flex;justify-content:space-between;gap:8px;color:#b7a1cf;font-size:10px;margin-top:8px}.status{color:#d6b8ef;text-align:right}@media(max-height:680px){.mic{margin:1px 0}.switches{margin-bottom:4px}.line{padding:6px 2px;margin:4px 0 9px}.player-panel{padding:8px 10px}.control{min-height:48px}.control.primary{min-height:52px}}

/* V5.3: app occupies exactly one viewport; only the lyrics scroll. */
html,body{height:100%;height:100dvh;overflow:hidden}
body{position:fixed;inset:0;width:100%;overflow:hidden}
main{height:100%;height:100dvh;min-height:0;max-height:100dvh;overflow:hidden;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{flex:0 0 auto}
#lyrics{flex:1 1 0;min-height:0;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.player-panel{flex:0 0 auto;position:relative;z-index:5;width:100%;margin-top:6px}
.line{overflow-wrap:break-word}
@media(max-width:430px){.line{font-size:clamp(21px,6vw,27px);padding:8px 2px;margin:5px 0 12px}.player-panel{padding:9px 8px 8px}.controls{gap:4px}.control{min-height:55px}.control .symbol{font-size:23px}.switches{margin-bottom:5px}.artist{margin-bottom:6px}}
</style></head><body><main>
<header><h1>MY KARAOKE AI</h1><div class="tag">Sing. Learn. Feel the music.</div><div class="mic">&#127908;</div><div class="song">Je t'ai perdu dans la nuit</div><div class="artist">Velorith</div><div class="switches"><button id="es" class="active" type="button">ES Espa&ntilde;ol</button><button id="en" type="button">GB English</button><button id="toggle" type="button">Traducci&oacute;n: ON</button></div></header>
<section id="lyrics" aria-label="Letras sincronizadas"><div class="line">Cargando letras...</div></section>
<div class="player-panel"><div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Progreso de la canci&oacute;n"><span id="duration">0:00</span></div><div class="controls">
<button class="control" id="restart" type="button"><span class="symbol" aria-hidden="true">&#8634;</span><span>Inicio</span></button>
<button class="control" id="back" type="button"><span class="symbol" aria-hidden="true">&#8630;</span><span>−10 s</span></button>
<button class="control primary" id="play" type="button"><span class="symbol" id="playSymbol" aria-hidden="true">&#9654;</span><span id="playLabel">Play</span></button>
<button class="control" id="forward" type="button"><span class="symbol" aria-hidden="true">&#8631;</span><span>+10 s</span></button>
<button class="control" id="airplay" type="button"><span class="symbol" aria-hidden="true">&#9655;</span><span>AirPlay</span></button>
</div><div class="foot"><span>MY KARAOKE AI &middot; V5.4</span><span id="status" class="status">Listo para cantar &#127926;</span></div></div>
<audio id="player" preload="metadata" playsinline webkit-playsinline src="song.m4a"></audio>
</main><script>
(()=>{'use strict';
if('scrollRestoration' in history)history.scrollRestoration='manual';
const audio=document.getElementById('player'),lyrics=document.getElementById('lyrics'),seek=document.getElementById('seek');
const status=document.getElementById('status');let audioReady=false;let segments=[],language='es',translationOn=true,activeIndex=-1,seeking=false;
const $=id=>document.getElementById(id);
const fmt=t=>Number.isFinite(t)?`${Math.floor(Math.max(0,t)/60)}:${String(Math.floor(Math.max(0,t)%60)).padStart(2,'0')}`:'0:00';
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
function normalize(data){const arr=Array.isArray(data)?data:(data.segments||data.lines||[]);return arr.map((s,i)=>({start:Number(s.start)||0,end:Number(s.end)||0,text:clean(s.text||s.line||''),words:Array.isArray(s.words)?s.words:[],translations:s.translations||{},translation_es:s.translation_es||s.es||'',translation_en:s.translation_en||s.en||''}));}
function translation(s){let t=s.translations;if(typeof t==='object'&&t){const v=t[language]||t[language==='es'?'spanish':'english'];if(typeof v==='string')return v;}return language==='es'?s.translation_es:s.translation_en;}
function render(){lyrics.replaceChildren();segments.forEach((s,i)=>{const line=document.createElement('div');line.className='line';line.id='line-'+i;line.dataset.index=i;if(s.words.length){s.words.forEach((w,j)=>{const span=document.createElement('span');span.className='word';span.id='w-'+i+'-'+j;span.textContent=String(w.word??w.text??'')+(j===s.words.length-1?'':' ');line.appendChild(span);});}else{const span=document.createElement('span');span.className='word';span.textContent=s.text;line.appendChild(span);}const tr=document.createElement('div');tr.className='translation'+(translationOn?'':' hidden');tr.textContent=translation(s);line.appendChild(tr);lyrics.appendChild(line);});activeIndex=-1;update(true);}
function updateTranslations(){segments.forEach((s,i)=>{const tr=$('line-'+i)?.querySelector('.translation');if(tr){tr.textContent=translation(s);tr.classList.toggle('hidden',!translationOn);}});}
function update(force=false){const t=audio.currentTime||0;const d=audio.duration;if(!seeking){seek.value=Number.isFinite(d)&&d>0?String(Math.round(t/d*1000)):'0';} $('elapsed').textContent=fmt(t);$('duration').textContent=fmt(d);let index=-1;for(let i=0;i<segments.length;i++){const s=segments[i];if(t>=s.start&&t<s.end){index=i;break;}}if(index===-1&&segments.length&&t>=segments[segments.length-1].end)index=segments.length-1;
segments.forEach((s,i)=>{const el=$('line-'+i);if(!el)return;el.classList.toggle('current',i===index);s.words.forEach((w,j)=>{const node=$('w-'+i+'-'+j);if(node)node.classList.toggle('sung',i===index&&t>=Number(w.start??s.start));});});if(index!==activeIndex||force){activeIndex=index;if(index>=0){const el=$('line-'+index);if(el){const top=el.offsetTop-lyrics.offsetTop-lyrics.clientHeight*.35;lyrics.scrollTo({top:Math.max(0,top),behavior:force?'instant':'smooth'});}}}}
function syncPlay(){const playing=!audio.paused;$('playSymbol').textContent=playing?'❚❚':'▶';$('playLabel').textContent=playing?'Pausa':'Play';}
$('play').addEventListener('click',async()=>{if(!audioReady){status.textContent='Preparando audio...';return;}if(audio.paused){try{await audio.play();status.textContent='Reproduciendo 🎵';}catch(e){status.textContent='Toca Play nuevamente';}}else{audio.pause();status.textContent='En pausa';}});
$('restart').addEventListener('click',()=>{if(!audioReady)return;audio.currentTime=0;update(true);status.textContent='Desde el inicio';});
$('back').addEventListener('click',()=>{if(!audioReady)return;audio.currentTime=Math.max(0,audio.currentTime-10);update(true);});
$('forward').addEventListener('click',()=>{if(!audioReady)return;audio.currentTime=Math.min(Number.isFinite(audio.duration)?audio.duration:Infinity,audio.currentTime+10);update(true);});
$('airplay').addEventListener('click',()=>{if(typeof audio.webkitShowPlaybackTargetPicker==='function'){try{audio.webkitShowPlaybackTargetPicker();}catch(e){status.textContent='Usa Centro de Control → AirPlay';}}else{status.textContent='Usa Centro de Control → AirPlay';}});
seek.addEventListener('input',()=>{if(!audioReady)return;seeking=true;if(Number.isFinite(audio.duration)){audio.currentTime=Number(seek.value)/1000*audio.duration;update();}});
seek.addEventListener('change',()=>{seeking=false;update(true);});
$('es').addEventListener('click',()=>{language='es';$('es').classList.add('active');$('en').classList.remove('active');updateTranslations();});
$('en').addEventListener('click',()=>{language='en';$('en').classList.add('active');$('es').classList.remove('active');updateTranslations();});
$('toggle').addEventListener('click',()=>{translationOn=!translationOn;$('toggle').textContent='Traducción: '+(translationOn?'ON':'OFF');updateTranslations();});
audio.addEventListener('timeupdate',()=>update());audio.addEventListener('seeked',()=>update(true));audio.addEventListener('loadedmetadata',()=>update());audio.addEventListener('play',syncPlay);audio.addEventListener('pause',syncPlay);audio.addEventListener('ended',syncPlay);
function frame(){if(!audio.paused)update();requestAnimationFrame(frame);}requestAnimationFrame(frame);
// Load the audio as a local Blob. Python's basic http.server does not serve HTTP byte ranges,
// which makes browser seeks in M4A files jump back to the start. Blob URLs are seekable.
status.textContent='Preparando audio...';
fetch('song.m4a?v=54', {cache:'no-store'}).then(r=>{
 if(!r.ok)throw Error('HTTP '+r.status);
 return r.blob();
}).then(blob=>{
 if(!blob.size)throw Error('Audio vacío');
 const localAudioUrl=URL.createObjectURL(blob);
 audio.pause();
 audio.src=localAudioUrl;
 audio.load();
 audioReady=true;
 status.textContent='Audio listo · '+(segments.length||0)+' estrofas';
}).catch(err=>{
 status.textContent='No se pudo preparar audio: '+err.message;
});

fetch('song.json?v=54').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(data=>{segments=normalize(data);render();status.textContent=segments.length+' estrofas cargadas';}).catch(err=>{lyrics.textContent='No se pudieron cargar las letras: '+err.message;status.textContent='Error al cargar letras';});
})();
</script></body></html>
